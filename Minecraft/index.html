<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft</title>
    <link rel="stylesheet" href="archivos/css/style.css">
</head>
<body>
    <header>
        <nav>
            <img src="archivos/img/Logo.svg" alt="Logo-minecraft">
            <ul class="ul-1">
                <li>JUEGOS</li>
                <li>TIENDA</li>
                <li>EXPLORACION</li>
                <li>APRENDER</li>
                <li>SOPORTE</li>
            </ul>
            <ul class="ul-2"> 
                <li><button class="boton-verde">Compra Ahora <p>></p> </button></li>
                <div>
                <li><button>🔎 <p>></p></button></li>
                <li><button>Cuenta<p>></p></button></li>
                </div>
            </ul>
        </nav>
    </header>
    <main>
        <section class="fondos">
           <div class="fondo">
            <img src="archivos/img/fondo1.webp" alt="fondo1">
           </div>
           <div class="cajas">
                <div class="cabeza">
                    <div>
                        <div class="bloque-oscuro" style="grid-area: cabe;"></div>
                        <div class="bloque-transparente" style="grid-area: cab;"></div>
                    </div>
                </div>
                <div class="textos-fondo">
                    <h2>¡Resérvalo ya!</h2>
                    <p>Entra en una nueva dimensión en Minecraft Dungeons II! Atrévete con Sift y enfréntate a amenazas desconocidas que te pondrán a prueba como nunca antes.</p>
                    <button>RESERVAR ></button>
                </div>
                    <button class="btn-fondo1" >Fondo 1</button>
                    <button class="btn-fondo2" >Fondo 2</button>
                    <button class="btn-fondo3" >Fondo 3</button>
            </div>
            

        </section>


    </main>
    <footer>



    </footer>
    
</body>
</html>
